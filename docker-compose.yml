services:
  backend:
    build: ./backend
    container_name: calc-backend
    restart: unless-stopped
    volumes:
      # Persist the SQLite DB across container restarts
      - ./backend/data:/app/data
    environment:
      - DB_PATH=/app/data/database.db
    # No "ports:" needed — nginx proxies to it internally.
    # Uncomment below to test the API directly on the host:
    # ports:
    #   - "5000:5000"
    networks:
      - calc-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/history')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: calc-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - calc-net

networks:
  calc-net:
    driver: bridge
    